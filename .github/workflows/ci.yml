name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($unformatted.Count -gt 0) {
            $unformatted | ForEach-Object { Write-Error "Not formatted: $_" }
            exit 1
          }

      - name: Vet
        shell: pwsh
        run: |
          if (@(go list ./...).Count -eq 0) {
            Write-Host "No Go packages yet; skipping vet."
            exit 0
          }
          go vet ./...

      - name: Unit tests
        shell: pwsh
        run: |
          if (@(go list ./...).Count -eq 0) {
            Write-Host "No Go packages yet; skipping unit tests."
            exit 0
          }
          go test -count=1 ./...

      - name: Race tests
        shell: pwsh
        run: |
          if (@(go list ./...).Count -eq 0) {
            Write-Host "No Go packages yet; skipping race tests."
            exit 0
          }
          go test -race -count=1 ./...

      - name: Build
        shell: pwsh
        run: |
          if (@(go list ./...).Count -eq 0) {
            Write-Host "No Go packages yet; skipping build."
            exit 0
          }
          go build ./...

  standard-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - run: ./validate.ps1 all
        shell: pwsh
