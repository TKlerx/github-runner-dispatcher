# Copy this file per participant. Never put a token value in YAML.
participant_name: jan-cachy

repositories:
  - owner: TKlerx
    name: travel-agent
    # visibility defaults to private when omitted.
    runner_group_id: 1
  - owner: TKlerx
    name: calendar-sync
    runner_group_id: 1

# Public repositories require trusted_workflows. Private repositories may also use
# them when label-only dispatch is too broad. Each workflow uses exactly one ID or
# path and can have different actor rules for different events:
#
#    visibility: public
#    trusted_workflows:
#      - workflow_id: 123456
#        rules:
#          - events: [pull_request]
#            actors: ["*"]
#            required_labels: [dedicated-workload]
#          - events: [repository_dispatch]
#            actors: [trusted-operator]
#            required_labels: [dedicated-workload]

labels:
  - self-hosted
  - Windows
  - X64
  # - dedicated-workload

poll_interval: 10s
claim_delay: 0s
acquisition_timeout: 90s
capacity: 1

token_file: C:/ProgramData/github-runner-dispatcher/token
runner_template_dir: C:/ProgramData/github-runner-dispatcher/actions-runner-template
state_dir: C:/ProgramData/github-runner-dispatcher/state

github_api_url: https://api.github.com
github_api_version: "2026-03-10"
